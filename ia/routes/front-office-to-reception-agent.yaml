# yaml-language-server: $schema=https://raw.githubusercontent.com/miguelperezcolom/ec-demo1/master/gitops/ia-catalogue.schema.json
kind: route
id: front-office-to-reception-agent
name: The front office uses the reception agent
priority: 100
# The console's own agent, stated here so the catalogue shows who answers each console. The gateway
# already sends it as X-Default-Agent; a more specific route (a lower priority, like the mapping
# screens' 5) still wins.
channel: front-office
targetAgent: reception-agent
