# yaml-language-server: $schema=https://raw.githubusercontent.com/miguelperezcolom/ec-demo1/master/gitops/ia-catalogue.schema.json
kind: llm
id: anthropic
name: Anthropic
provider: ANTHROPIC
model: claude-sonnet-4-5
temperature: 0.1
maxTokens: 4096
# La clave no está aquí. El plano de control la resuelve de esta variable, que viene de un Secret.
credentialEnv: ANTHROPIC_API_KEY
